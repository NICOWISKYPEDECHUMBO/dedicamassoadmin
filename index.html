<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1c2a6b">
<title>Dedica Saúde – Administração de Agendamentos</title>
<style>
:root{
 --pet:#1c2a6b;--pet2:#2b3a8f;--teal:#3554c4;--teal2:#4f7be6;--menta:#e7eefc;--ambar:#d32f2f;
 --bg:#eef2fa;--card:#ffffff;--txt:#16213f;--sub:#5c6785;--borda:#dde3f0;
 --azul:#2f6fd6;--verde2:#3554c4;--verde:#2b3a8f;--cinza:#8a9ca1;
 --sombra:0 1px 0 rgba(255,255,255,.9) inset,0 2px 4px rgba(28,42,107,.08),0 10px 24px -8px rgba(28,42,107,.22);
 --sombra-alta:0 2px 0 rgba(255,255,255,.8) inset,0 6px 12px rgba(28,42,107,.10),0 24px 48px -16px rgba(28,42,107,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;color:var(--txt);
 background:radial-gradient(1200px 600px at 10% -10%,#d5e0f7 0,transparent 60%),radial-gradient(900px 500px at 110% 110%,#e3e9f8 0,transparent 55%),linear-gradient(160deg,#e9eef9,#f3f6fc);}
button{font:inherit}
#app{max-width:820px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;padding:12px;gap:12px}
#app.largo{max-width:1280px}
@media(max-width:560px){#app{padding:0;gap:0}}

/* CABEÇALHO */
header{flex-shrink:0;border-radius:22px;color:#fff;position:relative;overflow:hidden;
 background:linear-gradient(135deg,var(--pet) 0%,var(--pet2) 55%,var(--teal) 100%);
 box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 -3px 0 rgba(0,0,0,.18) inset,0 14px 30px -12px rgba(28,42,107,.6)}
header::after{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 65%);pointer-events:none}
@media(max-width:560px){header{border-radius:0 0 22px 22px}}
.topo{display:flex;align-items:center;gap:14px;padding:14px 18px 10px;position:relative;z-index:1}
.logo{display:flex;align-items:center;gap:10px;flex-shrink:0;background:#fff;border-radius:14px;padding:6px 12px;
 box-shadow:0 2px 0 rgba(0,0,0,.12),0 6px 14px rgba(0,0,0,.18)}
.logo img{height:40px;display:block}
.logo svg{width:32px;height:32px;display:block}
.logo .marca{line-height:1}
.logo .marca b{display:block;color:var(--pet);font-size:17px;letter-spacing:.2px;font-weight:800}
.logo .marca small{display:block;color:var(--teal);font-size:10.5px;font-weight:700;letter-spacing:2.4px;text-transform:uppercase;margin-top:2px}
.tit{min-width:0}
.topo h1{font-size:15.5px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topo small#tSub{font-size:12.5px;opacity:.85;display:flex;align-items:center;gap:6px}
.topo small#tSub::before{content:"";width:8px;height:8px;border-radius:50%;background:#6fe3a5;box-shadow:0 0 0 3px rgba(94,242,184,.25)}
.topo .acoes{margin-left:auto;display:flex;gap:4px}
.btn-ic{color:#fff;font-size:13px;cursor:pointer;padding:7px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);
 box-shadow:0 2px 0 rgba(0,0,0,.15)}
.btn-ic:hover{background:rgba(255,255,255,.2)}
nav.abas{display:flex;gap:6px;margin:4px 14px 14px;padding:5px;border-radius:16px;background:rgba(0,0,0,.18);box-shadow:inset 0 2px 6px rgba(0,0,0,.25);position:relative;z-index:1}
nav.abas button{flex:1;border:0;background:none;color:rgba(255,255,255,.78);padding:9px 0;font-weight:700;font-size:13.5px;border-radius:12px;cursor:pointer;transition:.18s}
nav.abas button.on{color:var(--pet);background:linear-gradient(#fff,#e9eefc);box-shadow:0 1px 0 #fff inset,0 3px 0 #b5c6ee,0 6px 12px rgba(0,0,0,.2);transform:translateY(-1px)}
.aviso{background:#fff4dc;color:#7a5600;font-size:12.5px;padding:8px 14px;text-align:center;border-radius:14px;box-shadow:var(--sombra)}
main{flex:1;min-height:0;display:flex;flex-direction:column}
.tela{display:none;flex:1;min-height:0;flex-direction:column}
.tela.on{display:flex}

/* CONVERSA */
#t-chat{background:var(--card);border-radius:22px;box-shadow:var(--sombra-alta);overflow:hidden}
@media(max-width:560px){#t-chat{border-radius:0}}
#msgs{flex:1;overflow-y:auto;padding:18px 5% 12px;display:flex;flex-direction:column;
 background:linear-gradient(180deg,#f6f8fd,#eef2fb)}
.dia{align-self:center;background:#fff;color:var(--sub);font-size:11.5px;font-weight:700;letter-spacing:.6px;padding:5px 14px;border-radius:20px;margin:10px 0 8px;box-shadow:var(--sombra)}
.msg{max-width:80%;padding:10px 14px 9px;border-radius:18px;margin:3px 0;font-size:14.6px;line-height:1.45;overflow-wrap:anywhere;white-space:pre-wrap;position:relative}
.msg.bot{background:#fff;align-self:flex-start;margin:8px 0 2px 44px;border-top-left-radius:6px;box-shadow:var(--sombra);border:1px solid #e3e9f6}
.msg.bot::before{content:"";position:absolute;left:-44px;top:0;width:34px;height:34px;border-radius:12px;
 background:var(--logo-mini) center/22px no-repeat,linear-gradient(145deg,#fff,#e6ecfa);box-shadow:0 2px 0 #c8d3ef,0 4px 10px rgba(28,42,107,.18)}
.msg.eu{align-self:flex-end;margin-top:8px;border-top-right-radius:6px;color:#fff;
 background:linear-gradient(145deg,var(--teal) 0%,var(--pet2) 100%);
 box-shadow:0 1px 0 rgba(255,255,255,.3) inset,0 -2px 0 rgba(0,0,0,.12) inset,0 8px 18px -8px rgba(43,58,143,.7)}
.msg.eu b{color:#fff}
.msg .hr{float:right;font-size:10.5px;color:var(--sub);margin:8px 0 -4px 12px;white-space:nowrap;font-weight:600}
.msg.eu .hr{color:rgba(255,255,255,.75)}
.digitando{display:flex;gap:5px;padding:14px 16px!important}
.digitando span{width:7px;height:7px;border-radius:50%;background:var(--teal);animation:pula 1s infinite}
.digitando span:nth-child(2){animation-delay:.15s}.digitando span:nth-child(3){animation-delay:.3s}
@keyframes pula{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-5px);opacity:1}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 6px 44px;align-self:flex-start;max-width:92%}
.chip{background:linear-gradient(#fff,#f2f5fc);border:1px solid #cfd9f1;color:var(--pet);padding:9px 15px;border-radius:14px;font-size:13.8px;cursor:pointer;font-weight:600;text-align:left;
 box-shadow:0 3px 0 #c3cfee,0 6px 12px -6px rgba(28,42,107,.35);transition:transform .08s,box-shadow .08s}
.chip:hover{border-color:var(--teal2);background:linear-gradient(#fff,#e8eefc)}
.chip:active{transform:translateY(3px);box-shadow:0 0 0 #c3cfee,0 2px 4px rgba(28,42,107,.2)}
.chips.usado{display:none}
.barra{display:flex;gap:10px;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:#fff;align-items:flex-end;flex-shrink:0;border-top:1px solid var(--borda)}
.barra textarea{flex:1;border:1px solid #d3dcf0;border-radius:16px;padding:12px 16px;font:inherit;font-size:15px;resize:none;height:48px;max-height:130px;outline:none;background:#f4f7fd;line-height:1.35;color:var(--txt);
 box-shadow:inset 0 2px 5px rgba(28,42,107,.08)}
.barra textarea:focus{border-color:var(--teal2);background:#fff}
.enviar{width:48px;height:48px;border-radius:16px;border:0;cursor:pointer;flex-shrink:0;display:grid;place-items:center;
 background:linear-gradient(145deg,var(--teal2),var(--pet2));box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 4px 0 var(--pet),0 10px 18px -6px rgba(28,42,107,.6);transition:transform .08s,box-shadow .08s}
.enviar:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 0 0 var(--pet),0 4px 8px rgba(28,42,107,.4)}
.enviar svg{width:21px;height:21px;fill:#fff;margin-left:2px}

/* AGENDA */
.painel{flex:1;overflow-y:auto;padding:2px}
.card{background:var(--card);border-radius:20px;box-shadow:var(--sombra-alta);padding:16px;margin-bottom:12px;border:1px solid #e0e7f5}
.mesnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mesnav h2{font-size:18px;text-transform:capitalize;color:var(--pet)}
.mesnav button{border:1px solid #d3dcf0;background:linear-gradient(#fff,#eef2fb);border-radius:12px;width:38px;height:38px;cursor:pointer;font-size:18px;color:var(--pet);box-shadow:0 3px 0 #c9d4ef}
.mesnav button:active{transform:translateY(3px);box-shadow:none}
.grade{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.grade .cab{font-size:11.5px;color:var(--sub);text-align:center;font-weight:700;padding:4px 0}
.cel{min-height:58px;border-radius:12px;background:linear-gradient(#fff,#f3f6fc);padding:6px;cursor:pointer;border:1px solid #e0e6f4;display:flex;flex-direction:column;gap:3px;
 box-shadow:0 3px 0 #d8e0f2,0 4px 8px -4px rgba(28,42,107,.18);transition:transform .08s}
.cel:hover{transform:translateY(-2px)}
.cel.fora{visibility:hidden}
.cel .n{font-size:12.5px;font-weight:700;color:var(--txt)}
.cel.hoje .n{background:linear-gradient(145deg,var(--ambar),#b71c1c);color:#fff;border-radius:8px;width:24px;height:24px;display:grid;place-items:center;box-shadow:0 2px 0 #8e1616}
.cel.sel{border-color:var(--teal);background:linear-gradient(#e9effd,#dfe7fb);box-shadow:0 3px 0 #a9bdf0,0 6px 12px -4px rgba(53,84,196,.5)}
.pontos{display:flex;flex-wrap:wrap;gap:3px}
.pt{font-size:10px;padding:0 6px;border-radius:7px;color:#fff;font-weight:700;line-height:16px}
.st-agendado{background:linear-gradient(145deg,#6c8ff0,var(--azul))}.st-concluido{background:linear-gradient(145deg,var(--teal2),var(--teal))}.st-cancelado{background:var(--cinza)}
.leg{display:flex;gap:14px;font-size:12px;color:var(--sub);margin-top:12px;flex-wrap:wrap}
.leg i{display:inline-block;width:11px;height:11px;border-radius:4px;margin-right:5px;vertical-align:-1px}
.item{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--borda)}
.item:first-of-type{border-top:0}
.item .h{font-weight:800;min-width:52px;font-size:14px;color:var(--pet);background:var(--menta);border-radius:10px;text-align:center;padding:6px 0}
.item .d{flex:1;font-size:14px}
.item .d small{display:block;color:var(--sub);font-size:12.5px;margin-top:2px}
.tag{font-size:11px;padding:3px 10px;border-radius:10px;color:#fff;font-weight:700;white-space:nowrap}
.vazio{color:var(--sub);font-size:14px;text-align:center;padding:16px 0}
.linha-op{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--sub);margin-bottom:10px}

/* CONFERÊNCIA */
.form-ad{max-width:380px;margin:30px auto;text-align:center}
.form-ad h2{font-size:19px;margin-bottom:6px;color:var(--pet)}
.form-ad p{color:var(--sub);font-size:13.5px;margin-bottom:16px}
input,select{font:inherit;font-size:14px;padding:10px 12px;border:1px solid #d3dcf0;border-radius:12px;background:#f7f9fe;outline:none;color:var(--txt);box-shadow:inset 0 2px 4px rgba(28,42,107,.06)}
input:focus,select:focus{border-color:var(--teal2);background:#fff}
.btn{color:#fff;border:0;border-radius:12px;padding:10px 18px;font-weight:700;cursor:pointer;font-size:14px;
 background:linear-gradient(145deg,var(--teal2),var(--pet2));box-shadow:0 1px 0 rgba(255,255,255,.3) inset,0 3px 0 var(--pet),0 8px 14px -6px rgba(28,42,107,.55)}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--pet)}
.btn.sec{background:linear-gradient(#fff,#eef2fb);color:var(--pet);border:1px solid #cfd9f1;box-shadow:0 3px 0 #c6d1ee}
.btn.peq{padding:7px 13px;font-size:13px}
.filtros{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.resumo{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:14px}
.rs{border-radius:16px;padding:12px 14px;font-size:13px;background:linear-gradient(#fff,#f2f5fc);border:1px solid #dbe2f3;box-shadow:0 3px 0 #d0daf1,0 8px 16px -10px rgba(28,42,107,.4)}
.rs b{font-size:14px}
.rs .num{font-size:24px;font-weight:800;color:var(--teal)}
.tabwrap{overflow:auto;max-height:62vh;border-radius:14px;border:1px solid var(--borda)}
table{border-collapse:collapse;width:100%;font-size:13px;background:#fff}
th{position:sticky;top:0;background:linear-gradient(var(--pet2),var(--pet));color:#fff;text-align:left;padding:10px 9px;font-weight:700;white-space:nowrap;z-index:1}
td{padding:8px 9px;border-bottom:1px solid var(--borda);white-space:nowrap}
tr:nth-child(even) td{background:#f8fafe}
tr:hover td{background:#eaf0fd}
td.c{text-align:center}
td input[type=checkbox]{width:18px;height:18px;accent-color:var(--teal)}
.sub-abas{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.sub-abas button{border:1px solid #d3dcf0;background:linear-gradient(#fff,#eef2fb);border-radius:12px;padding:7px 15px;cursor:pointer;font-size:13px;font-weight:600;color:var(--pet);box-shadow:0 3px 0 #cdd7ef}
.sub-abas button.on{background:linear-gradient(145deg,var(--teal2),var(--pet2));color:#fff;border-color:transparent;box-shadow:0 3px 0 var(--pet)}
.aovivo{color:#d93838;font-size:12.5px;font-weight:800;align-self:center;animation:pisca 2s infinite}@keyframes pisca{50%{opacity:.35}}

/* modal/toast */
.fundo{position:fixed;inset:0;background:rgba(8,40,47,.5);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.fundo.on{display:flex}
.modal{background:#fff;border-radius:20px;padding:22px;max-width:380px;width:100%;box-shadow:0 30px 60px -20px rgba(0,0,0,.45),0 2px 0 #fff inset}
.modal p{font-size:15px;line-height:1.45;margin-bottom:18px;white-space:pre-wrap}
.modal .bts{display:flex;justify-content:flex-end;gap:8px}
#toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--pet);color:#fff;padding:11px 20px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:60;box-shadow:0 10px 24px -8px rgba(0,0,0,.5)}
#toast.on{opacity:1}

nav.abas{overflow-x:auto;scrollbar-width:none}
nav.abas button{flex:1 0 auto;padding:9px 12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:12px}
.kpi{background:linear-gradient(#fff,#f2f5fc);border-radius:18px;padding:14px 16px;border:1px solid #dbe2f3;box-shadow:0 4px 0 #d0daf1,0 12px 20px -12px rgba(28,42,107,.45)}
.kpi span{display:block;font-size:12.5px;color:var(--sub);font-weight:700}
.kpi b{font-size:30px;color:var(--pet)}
.kpi.alerta b{color:var(--ambar)}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:900px){.duas{grid-template-columns:1fr}}
.duas .card{margin-bottom:12px}
.aviso2{background:#fff4dc;border-color:#f2deb0}
.aviso2 a{color:var(--pet);font-weight:700}
.cod{color:var(--sub);font-size:11.5px;font-weight:600}
.ct{font-size:15px;color:var(--pet);margin-bottom:8px}
.dica{font-size:12.5px;color:var(--sub);margin-top:8px}
.lb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);font-weight:600}
.cel-in{width:100%;min-width:90px;padding:6px 8px;border-radius:8px;border:1px solid transparent;background:transparent;box-shadow:none;font-size:13px}
.cel-in:hover{border-color:#d3dcf0;background:#fff}
.cel-in:focus{border-color:var(--teal2);background:#fff}
.cel-in.num{text-align:right;max-width:120px}
.cel-in.salvo,select.salvo{background:#dfe7fb!important;transition:background .3s}
table.planilha td{padding:3px 5px}
table.planilha select{padding:6px 8px;font-size:13px}
tr.nova td{background:#f9fbff!important}
tr.nova .cel-in{border:1px dashed #b6c4e8}
tr.apagado td{opacity:.5}
select.st{font-size:12.5px;padding:5px 8px;font-weight:700;border-radius:10px}
select.st-agendado{background:#fff4dc;color:#8a5a00}
select.st-confirmado{background:#e3edff;color:#1f4fa8}
select.st-realizado{background:#dfe7fb;color:#2b3a8f}
select.st-faltou,select.st-cancelado{background:#eef0f1;color:#5d6b70}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--sub);font-weight:700}
.form label.full{grid-column:1/-1}
#formBox{max-width:560px}
.semana{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:8px}
.dsem{background:linear-gradient(#fff,#f3f6fc);border:1px solid #e0e6f4;border-radius:14px;padding:10px;box-shadow:0 3px 0 #d8e0f2;display:flex;flex-direction:column;gap:6px;font-size:13px}
.dsem>b{color:var(--pet)}
.intv small{display:block;font-size:10.5px;font-weight:600;color:var(--sub)}
.intv{display:flex;align-items:center;justify-content:space-between;background:var(--menta);border-radius:8px;padding:4px 8px;font-weight:700;color:var(--pet);font-size:12.5px}
.x{border:0;background:none;color:#b83232;cursor:pointer;font-weight:800}
.folga{color:var(--sub)}
.addh{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto}
.addh input{padding:5px;font-size:12px;flex:1 1 80px;min-width:80px}
.btn.mini{padding:3px 8px;font-size:11.5px;border-radius:8px;box-shadow:0 2px 0 #c6d1ee}
.perigo-t{color:#b83232!important}
.lst{padding-left:18px;font-size:13.5px;line-height:1.7}
@media(max-width:560px){#tSub,#aoVivo{display:none!important}}
.ro{color:var(--pet);padding:0 6px}
.semPix{color:#c0392b;font-weight:700;font-size:12.5px}
.sinal{display:inline-flex;gap:5px;align-items:center;font-size:12px;color:var(--sub);white-space:nowrap}
td.det{white-space:normal;font-size:12px;color:var(--sub);max-width:420px}
/* ASSISTENTE DE AGENDAMENTO (funcionário) */
#asFundo{position:fixed;inset:0;background:rgba(16,24,60,.45);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:60;padding:14px}
#asFundo.on{display:flex}
#asBox{width:100%;max-width:640px;height:min(760px,94dvh);background:#f3f6fd;border-radius:22px;box-shadow:var(--sombra-alta);display:flex;flex-direction:column;overflow:hidden}
#asTopo{display:flex;align-items:center;gap:12px;padding:12px 16px;color:#fff;background:linear-gradient(135deg,var(--pet),var(--pet2) 60%,var(--teal))}
#asTopo .av{width:46px;height:46px;border-radius:50%;background:#fff var(--asSprite) 0 0/525% auto no-repeat;background-position:-16px -1px;box-shadow:0 0 0 2px rgba(255,255,255,.7)}
#asTopo b{display:block;font-size:16px}#asTopo small{opacity:.85;font-size:12px}
#asTopo .x{margin-left:auto;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:10px;padding:7px 12px;cursor:pointer;font-weight:700}
#asMsgs{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:10px}
#asMsgs>*{flex-shrink:0}
.asM{max-width:86%;padding:10px 13px;border-radius:16px;line-height:1.45;font-size:14.5px;white-space:pre-wrap;word-wrap:break-word}
.asM.bot{align-self:flex-start;background:#fff;border:1px solid #e1e7f5;border-top-left-radius:6px;margin-left:58px;position:relative;box-shadow:0 2px 6px rgba(28,42,107,.06)}
.asM.bot.ult::before{content:"";position:absolute;left:-58px;top:-4px;width:48px;height:71px;border-radius:12px;background:#fff var(--asSprite) 0 0/300% 100% no-repeat;box-shadow:0 2px 6px rgba(28,42,107,.15);border-bottom:2px solid var(--pet2)}
.asM.bot.ult{min-height:66px}
.asM.bot.ult.fala::before{animation:asFala .5s infinite steps(1,end)}
@keyframes asFala{0%{background-position:0 0}15%{background-position:100% 0}35%{background-position:50% 0}50%{background-position:100% 0}70%{background-position:0 0}85%{background-position:50% 0}}
.asM.eu{align-self:flex-end;background:linear-gradient(135deg,var(--pet2),var(--teal));color:#fff;border-bottom-right-radius:6px}
.asM b{font-weight:700}
.asChips{display:flex;flex-wrap:wrap;gap:8px;margin-left:58px}
.asChip{background:#fff;border:1px solid #cfd9f1;color:var(--pet);border-radius:12px;padding:9px 13px;font-weight:600;cursor:pointer;font-size:14px;text-align:left;box-shadow:0 2px 0 #dbe3f5}
.asChip:hover{background:#eef3fe}
.asChip small{display:block;font-weight:500;color:var(--sub);font-size:12px}

.asChip.pri small{color:#e3e9ff}

.asCal .cab{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;font-weight:700;color:var(--pet)}
.asCal .cab button{border:1px solid #cfd9f1;background:#fff;border-radius:8px;width:30px;height:28px;cursor:pointer;color:var(--pet);font-weight:700}
.asCal .g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.asCal .ds{font-size:11px;color:var(--sub);text-align:center;font-weight:700}

.asCal .d.ok{background:#fff;color:var(--pet);border-color:#b9c7ea;cursor:pointer;box-shadow:0 2px 0 #dbe3f5}
.asCal .d.ok:hover{background:#eef3fe}
.asCal .d i{font-style:normal;font-size:9px;font-weight:600;color:var(--sub)}
.asCal .d.vz{visibility:hidden}
#asPe{display:flex;gap:8px;padding:10px 12px;background:#fff;border-top:1px solid #e1e7f5}
#asTxt{flex:1;border:1px solid #cfd9f1;border-radius:12px;padding:11px 12px;font:inherit;font-size:15px;outline:none}
#asTxt:focus{border-color:var(--teal)}
#asEnv{border:0;border-radius:12px;padding:0 16px;background:linear-gradient(135deg,var(--pet2),var(--teal));color:#fff;font-weight:700;cursor:pointer}

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const isoD = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hojeISO = () => isoD(new Date());
const addD = (iso,n) => { const d=new Date(iso+'T12:00'); d.setDate(d.getDate()+n); return isoD(d); };
const DIAS = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const DIASC = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const brD = iso => { if(!iso) return ''; const [y,m,d]=String(iso).slice(0,10).split('-'); return `${d}/${m}/${y}`; };
const brDC = iso => brD(iso).slice(0,5);
const dsem = iso => DIASC[new Date(String(iso).slice(0,10)+'T12:00').getDay()];
const reais = v => 'R$ ' + Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const num2 = v => Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const lerNum = s => { s=String(s||'').trim().replace(/[R$\s]/g,''); if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.'); const n=parseFloat(s); return isNaN(n)?0:n; };
const fmtTel = d => { d=String(d||'').replace(/\D/g,''); if(d.length===11) return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`; if(d.length===10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`; return d; };
const zap = t => t?`<a href="https://wa.me/55${String(t).replace(/\D/g,'')}" target="_blank" rel="noopener">${fmtTel(t)}</a>`:'';
const STL = {agendado:'Aguardando confirmação',confirmado:'Confirmado',realizado:'Realizado',faltou:'Não compareceu',cancelado:'Cancelado'};
const STC = {agendado:'agendado',confirmado:'agendado',realizado:'concluido',faltou:'cancelado',cancelado:'cancelado'};
const ESP = ['Check-up','Massoterapia','Fisioterapia'];
const futuro = a => { const d=new Date(); const agora=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); return (a.data+' '+a.hora)>agora; };
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2800);}
function confirmar(t,sim='Confirmar'){return new Promise(r=>{$('#mTxt').textContent=t;$('#mSim').textContent=sim;$('#fundo').classList.add('on');const fim=v=>{$('#fundo').classList.remove('on');$('#mSim').onclick=$('#mNao').onclick=null;r(v)};$('#mSim').onclick=()=>fim(true);$('#mNao').onclick=()=>fim(false);});}
function formulario(html){ $('#formBox').innerHTML=html; $('#fundoForm').classList.add('on'); return ()=>$('#fundoForm').classList.remove('on'); }

let SENHA=null; try{ SENHA=sessionStorage.getItem('dd_adm'); }catch(e){}
async function api(acao,args={}){
 let r; try{ r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({acao,senha:SENHA,...args})}); }
 catch(e){ throw new Error('Sem conexão com a internet.'); }
 const t=await r.text(); let j=null; try{ j=t?JSON.parse(t):null }catch(e){}
 if(!r.ok||!j||j.erro){ const m=(j&&j.erro)||('Erro no servidor ('+r.status+')'); if(/Senha incorreta/.test(m)&&acao!=='admLogin'){ sairAdm(); } throw new Error(m); }
 return j.dados;
}

}

/* ============ AGENDA ============ */
async function telaAgenda(silencioso){
 try{ AG=await carregarAgenda(F.de,F.ate); }catch(e){ if(!silencioso) toast(e.message); return; }
 if(silencioso&&$('#agTab')){ desenharAgTab(); return; }
 $('#P').innerHTML=`<div class="card"><div class="filtros">
   <label class="lb">De <input type="date" id="fDe" value="${F.de}"></label><label class="lb">Até <input type="date" id="fAte" value="${F.ate}"></label>
   <button class="btn sec peq" data-per="0">Hoje</button><button class="btn sec peq" data-per="1">Amanhã</button><button class="btn sec peq" data-per="7">7 dias</button><button class="btn sec peq" data-per="30">30 dias</button>
   <select id="fUnid"><option value="">Todas as unidades</option>${BASE.unidades.map(u=>`<option value="${u.id}"${F.unid==u.id?' selected':''}>${esc(u.nome)}</option>`).join('')}</select>
   <select id="fProf"><option value="">Todos os profissionais</option>${BASE.profissionais.map(p=>`<option value="${p.id}"${F.prof==p.id?' selected':''}>${esc(p.nome)}</option>`).join('')}</select>
   <select id="fSt"><option value="">Todos os status</option>${Object.entries(STL).map(([k,l])=>`<option value="${k}"${F.status===k?' selected':''}>${l}</option>`).join('')}</select>
   <input id="fBusca" placeholder="Buscar cliente" value="${esc(F.busca)}">
   <span style="flex:1"></span><button class="btn peq" id="novoAg">+ Novo agendamento</button>
  </div></div><div class="card"><div class="tabwrap" id="agTab"></div></div>`;
 const upd=()=>{F.de=$('#fDe').value;F.ate=$('#fAte').value;F.unid=$('#fUnid').value;F.prof=$('#fProf').value;F.status=$('#fSt').value;F.busca=$('#fBusca').value;};
 $('#fDe').onchange=$('#fAte').onchange=()=>{upd();telaAgenda();};
 $('#fUnid').onchange=$('#fProf').onchange=$('#fSt').onchange=()=>{upd();desenharAgTab();};
 $('#fBusca').oninput=()=>{upd();desenharAgTab();};
 $('#P').querySelectorAll('[data-per]').forEach(b=>b.onclick=()=>{const n=+b.dataset.per,h=hojeISO();if(n===0){F.de=F.ate=h;}else if(n===1){F.de=F.ate=addD(h,1);}else{F.de=h;F.ate=addD(h,n-1);}telaAgenda();});
 $('#novoAg').onclick=()=>novoAgendamento();
 desenharAgTab();
}
function desenharAgTab(){
 const b=F.busca.toLowerCase();
 const l=AG.filter(a=>(!F.unid||a.unidade_id==F.unid)&&(!F.prof||a.profissional_id==F.prof)&&(!F.status||a.status===F.status)&&(!b||a.cliente.toLowerCase().includes(b)||String(a.cliente_id)===b));
 $('#agTab').innerHTML=`<table><thead><tr><th>Data</th><th>Hora</th><th>Unidade</th><th>Cliente</th><th>WhatsApp</th><th>Serviço</th><th>Profissional</th><th>Valor</th><th>Status</th><th>Pago na unidade</th><th>NF</th><th>Observação</th></tr></thead><tbody>${l.map(a=>`<tr class="${a.status==='cancelado'?'apagado':''}">
  <td>${dsem(a.data)} ${brD(a.data)}</td><td>${horaAg(a)}</td><td>${esc(a.unidade||'—')}</td><td>${esc(a.cliente)} <span class="cod">#${a.cliente_id}</span></td><td>${zap(a.cliente_tel)}</td><td>${esc(a.servico)}</td><td>${esc(a.profissional)}</td><td>${reais(a.valor)}</td>
  <td><select data-st="${a.id}" class="st st-${a.status}">${Object.entries(STL).map(([k,v])=>`<option value="${k}"${a.status===k?' selected':''}>${v}</option>`).join('')}</select></td>
  <td class="c"><label class="sinal"><input type="checkbox" data-sinal="${a.id}"${a.sinal_pago?' checked':''}> ${reais(a.valor)}</label></td><td class="c">${a.quer_nf?'Sim':''}</td><td><input class="cel-in" data-obs="${a.id}" value="${esc(a.obs||'')}" placeholder="—"></td></tr>`).join('')||'<tr><td colspan="12" class="c" style="padding:20px">Nenhum agendamento no período.</td></tr>'}</tbody></table>`;
 $('#agTab').querySelectorAll('[data-st]').forEach(s=>s.onchange=async()=>{
  const a=AG.find(x=>x.id==s.dataset.st), novo=s.value;
  if(novo==='cancelado'&&!(await confirmar(`Cancelar o agendamento de ${a.cliente} em ${brD(a.data)} às ${a.hora}?\nO horário fica livre para outros clientes.`,'Cancelar agendamento'))){ s.value=a.status; return; }
  if(novo==='faltou'&&!(await confirmar(`${a.cliente} não veio (${brD(a.data)} às ${a.hora})?\n${futuro(a)?'O horário volta a ficar livre na agenda.':'O horário já passou, então só fica registrado como falta.'}`,'Não compareceu'))){ s.value=a.status; return; }
  try{ const r=await api('admAtualizarAg',{linha:{id:a.id,status:novo}}); Object.assign(a,r); toast((novo==='faltou'||novo==='cancelado')&&futuro(a)?'Status atualizado · horário liberado':'Status atualizado'); desenharAgTab(); }catch(e){ s.value=a.status; toast(e.message); }
 });
 $('#agTab').querySelectorAll('[data-sinal]').forEach(c=>c.onchange=async()=>{ if(!c.checked&&!(await confirmar('Desmarcar como pago na unidade?','Desmarcar'))){ c.checked=true; return; } try{ const r=await api('admAtualizarAg',{linha:{id:+c.dataset.sinal,sinal_pago:c.checked}}); const a=AG.find(x=>x.id==r.id); if(a) a.sinal_pago=r.sinal_pago; toast(c.checked?'Pagamento registrado':'Pagamento desmarcado'); }catch(e){ c.checked=!c.checked; toast(e.message); } });
 $('#agTab').querySelectorAll('[data-obs]').forEach(i=>i.onchange=async()=>{ try{ await api('admAtualizarAg',{linha:{id:+i.dataset.obs,obs:i.value}}); toast('Observação salva'); }catch(e){toast(e.message);} });
}
function novoAgendamento(){ abrirAssistente(); }

/* ============ TABELA EDITÁVEL GENÉRICA ============ */
const PIXT=['CPF','CNPJ','E-mail','Telefone','Aleatória'];
function campo(tipo,val,attrs){
 if(tipo==='modo') return `<select ${attrs}>${Object.entries(MODO).map(([k,v])=>`<option value="${k}"${val===k?' selected':''}>${v}</option>`).join('')}</select>`;
 if(tipo==='modoprof') return `<select ${attrs}><option value="">Padrão da unidade</option>${Object.entries(MODO).map(([k,v])=>`<option value="${k}"${val===k?' selected':''}>${v}</option>`).join('')}</select>`;
 if(tipo==='intnull') return `<input class="cel-in num" type="number" min="1" ${attrs} value="${val??''}" placeholder="sem limite">`;
 if(tipo==='ro') return `<b class="ro">${val==null||val===''?'—':esc(val)}</b>`;
 if(tipo==='pixtipo') return `<select ${attrs}><option value="">—</option>${PIXT.map(e=>`<option${val===e?' selected':''}>${e}</option>`).join('')}</select>`;
 if(tipo==='esp') return `<select ${attrs}>${ESP.map(e=>`<option${val===e?' selected':''}>${e}</option>`).join('')}</select>`;
 if(tipo==='bool') return `<input type="checkbox" ${attrs}${val?' checked':''}>`;
 if(tipo==='moneynull') return `<input class="cel-in num" ${attrs} value="${val==null||val===''?'':num2(val)}" placeholder="—">`;
 if(tipo==='texto'){ const ls=String(val||'').split('\n').map(x=>x.trim()).filter(Boolean); return `<input type="hidden" ${attrs} value="${esc(val||'')}"><button type="button" class="btn sec mini" data-texto="1">${ls.length?ls.length+(ls.length===1?' item':' itens')+' · editar':'Adicionar itens'}</button>`; }
 if(tipo==='money') return `<input class="cel-in num" ${attrs} value="${val==null?'':num2(val)}">`;
 if(tipo==='int') return `<input class="cel-in num" type="number" ${attrs} value="${val??''}">`;
 return `<input class="cel-in" ${attrs} value="${esc(val??'')}">`;
}
function lerCampo(el,tipo){ if(tipo==='moneynull') return el.value.trim()===''?'':lerNum(el.value); if(tipo==='texto') return el.value; if(tipo==='bool') return el.checked; if(tipo==='intnull') return el.value===''?'':parseInt(el.value,10); if(tipo==='money') return lerNum(el.value); if(tipo==='int') return parseInt(el.value,10)||0; return el.value.trim(); }
function tabelaEditavel(cont,{tabela,cols,linhas,novo,extra,aoSalvar}){
 cont.innerHTML=`<table class="planilha"><thead><tr>${cols.map(c=>`<th>${c.t}</th>`).join('')}${extra?'<th></th>':''}</tr></thead><tbody>
  ${linhas.map(l=>`<tr data-id="${l.id}">${cols.map(c=>`<td>${campo(c.tipo,l[c.k],`data-k="${c.k}"`)}</td>`).join('')}${extra?`<td>${extra(l)}</td>`:''}</tr>`).join('')}
  <tr class="nova">${cols.map(c=>`<td>${c.tipo==='ro'?'<b class="ro">+</b>':campo(c.tipo,c.padrao??'',`data-k="${c.k}"`+(c===cols.find(x=>x.tipo!=='ro')?` placeholder="+ ${novo}"`:''))}</td>`).join('')}${extra?'<td></td>':''}</tr></tbody></table>`;
 cont.querySelectorAll('tr[data-id] [data-k]').forEach(el=>el.onchange=async()=>{
  const c=cols.find(x=>x.k===el.dataset.k), id=+el.closest('tr').dataset.id; if(!c||c.tipo==='ro') return;
  try{ const r=await api('admSalvar',{tabela,linha:{id,[c.k]:lerCampo(el,c.tipo)}}); el.classList.add('salvo'); setTimeout(()=>el.classList.remove('salvo'),900); aoSalvar&&aoSalvar(r,false); }catch(e){ toast(e.message); }
 });
 cont.querySelectorAll('[data-texto]').forEach(b=>b.onclick=()=>{ const inp=b.previousElementSibling; const tr=b.closest('tr'); const nome=(tr.querySelector('[data-k="nome"]')||{}).value||'';
  const fechar=formulario(`<h3 class="ct">O que está incluído${nome?' · '+esc(nome):''}</h3><p class="dica">O cliente vê esta lista quando escolhe o serviço. Escreva um item por linha.</p><textarea id="txItens" rows="14" style="width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid #cfd9f1">${esc(inp.value)}</textarea><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px"><button class="btn sec" id="txCan">Cancelar</button><button class="btn" id="txOk">Salvar</button></div>`);
  $('#txCan').onclick=fechar; $('#txOk').onclick=()=>{ inp.value=$('#txItens').value.split('\n').map(x=>x.trim()).filter(Boolean).join('\n'); fechar(); inp.dispatchEvent(new Event('change')); };
 });
 const nova=cont.querySelector('tr.nova');
 nova.querySelector('[data-k]:not(b)').onchange=async()=>{
  const linha={}; nova.querySelectorAll('[data-k]:not(b)').forEach(el=>{ const c=cols.find(x=>x.k===el.dataset.k); linha[c.k]=lerCampo(el,c.tipo); });
  const prim=cols.find(x=>x.tipo!=='ro'); if(!linha[prim.k]) return;
  try{ const r=await api('admSalvar',{tabela,linha}); toast('Adicionado'); aoSalvar&&aoSalvar(r,true); }catch(e){ toast(e.message); }
 };
}

function painelHorarios(){
 const p=BASE.profissionais.find(x=>x.id===profSel); if(!p) return;
 const hs=BASE.horarios.filter(h=>h.profissional_id===p.id);
 const bl=BASE.bloqueios.filter(b=>b.profissional_id===p.id||b.profissional_id==null);
 $('#hPainel').innerHTML=`<div class="card"><h3 class="ct">Horários de atendimento · ${esc(p.nome)}</h3>
  ${!BASE.unidades.length?'<div class="aviso2" style="padding:10px;border-radius:12px;margin-bottom:10px">Cadastre primeiro as <b>unidades</b> (aba Unidades).</div>':''}
  <div class="filtros" style="margin-bottom:10px"><label class="lb">Adicionar horários na unidade <select id="hUnid">${BASE.unidades.filter(u=>u.ativo).map(u=>`<option value="${u.id}">${esc(u.nome)} · ${MODO[p.modo||u.modo]}</option>`).join('')}</select></label></div>
  <p class="dica" style="margin:0 0 10px">Hora marcada: o intervalo é dividido pela duração do serviço. Ordem de chegada: o intervalo inteiro vira um turno.</p>
  <div class="semana">${DIAS.map((d,i)=>`<div class="dsem"><b>${d}</b>${hs.filter(h=>h.dia_semana===i).map(h=>`<div class="intv"><span>${h.inicio}–${h.fim}<small>${h.unidade_id?esc(nomeUnid(h.unidade_id)):'sem unidade'}</small></span><button class="x" data-delh="${h.id}" title="Remover">Remover</button></div>`).join('')||'<small class="folga">Folga</small>'}
   <div class="addh"><input type="time" data-ini="${i}" value="08:00"><input type="time" data-fim="${i}" value="18:00"><button class="btn sec peq" data-addh="${i}">+</button></div></div>`).join('')}</div>
  <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn sec peq" id="hPadrao">Preencher seg a sex, 08:00–18:00</button><button class="btn sec peq" id="hFechar">Fechar</button></div></div>
  <div class="card"><h3 class="ct">Folgas e bloqueios de agenda</h3>
  <div class="filtros"><input type="date" id="bData" value="${hojeISO()}"><select id="bUnid"><option value="">Todas as unidades</option>${BASE.unidades.map(u=>`<option value="${u.id}">${esc(u.nome)}</option>`).join('')}</select><input id="bMot" placeholder="Motivo (férias, feriado...)"><label class="lb"><input type="checkbox" id="bTodos"> Todos os profissionais</label><button class="btn peq" id="bAdd">Bloquear dia</button></div>
  <div style="margin-top:10px">${bl.length?bl.map(b=>`<div class="item"><div class="h">${brDC(b.data)}</div><div class="d">${esc(b.motivo||'Bloqueio')}<small>${b.profissional_id?esc(p.nome):'Todos os profissionais'} · ${b.unidade_id?esc(nomeUnid(b.unidade_id)):'Todas as unidades'}</small></div><button class="btn sec peq" data-delb="${b.id}">Remover</button></div>`).join(''):'<div class="vazio">Nenhum bloqueio.</div>'}</div></div>`;
 const recarregar=async()=>{ await carregarBase(); telaProfs(); };
 $('#hPainel').querySelectorAll('[data-addh]').forEach(b=>b.onclick=async()=>{ const i=b.dataset.addh; const ini=$(`[data-ini="${i}"]`).value, fim=$(`[data-fim="${i}"]`).value; if(!ini||!fim||fim<=ini) return toast('O fim precisa ser depois do início.'); if(!$('#hUnid')||!$('#hUnid').value) return toast('Cadastre/escolha a unidade primeiro.'); try{ await api('admSalvar',{tabela:'horarios',linha:{profissional_id:p.id,unidade_id:+$('#hUnid').value,dia_semana:+i,inicio:ini,fim}}); recarregar(); }catch(e){toast(e.message);} });
 $('#hPainel').querySelectorAll('[data-delh]').forEach(b=>b.onclick=async()=>{ if(!(await confirmar('Remover este intervalo de horário?','Remover'))) return; try{ await api('admExcluir',{tabela:'horarios',id:+b.dataset.delh}); recarregar(); }catch(e){toast(e.message);} });
 $('#hPainel').querySelectorAll('[data-delb]').forEach(b=>b.onclick=async()=>{ if(!(await confirmar('Remover este bloqueio? O dia volta a ficar disponível.','Remover'))) return; try{ await api('admExcluir',{tabela:'bloqueios',id:+b.dataset.delb}); recarregar(); }catch(e){toast(e.message);} });
 $('#hPadrao').onclick=async()=>{ if(!$('#hUnid')||!$('#hUnid').value) return toast('Cadastre/escolha a unidade primeiro.'); const un=nomeUnid(+$('#hUnid').value); if(!(await confirmar(`Adicionar 08:00–18:00 de segunda a sexta para ${p.nome} na unidade ${un}?`,'Adicionar'))) return; try{ for(let i=1;i<=5;i++) await api('admSalvar',{tabela:'horarios',linha:{profissional_id:p.id,unidade_id:+$('#hUnid').value,dia_semana:i,inicio:'08:00',fim:'18:00'}}); recarregar(); }catch(e){toast(e.message);} };

}

async function carregarCli(){
 try{ CLI=await api('admClientes',{busca:cliBusca||null}); }catch(e){ return toast(e.message); }

/* ============ PAGAMENTOS ============ */
let PGAG=[];
const PER={mes:'Mês inteiro',q1:'1ª quinzena (1 a 15)',q2:'2ª quinzena (16 ao fim)'};
PG.per=PG.per||'mes';
function periodo(){ const [y,m]=PG.mes.split('-').map(Number); const ult=isoD(new Date(y,m,0)); if(PG.per==='q1') return [`${PG.mes}-01`,`${PG.mes}-15`]; if(PG.per==='q2') return [`${PG.mes}-16`,ult]; return [`${PG.mes}-01`,ult]; }
const nomeCurto = n => { const p=String(n||'').split(' ').filter(Boolean); return p.length>1?p[0]+' '+p[p.length-1][0]+'.':p[0]||''; };
function copiar(t,msg){ (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast(msg||'Copiado!')).catch(()=>{ const a=document.createElement('textarea'); a.value=t; document.body.appendChild(a); a.select(); try{document.execCommand('copy');toast(msg||'Copiado!');}catch(e){toast('Não foi possível copiar');} a.remove(); }); }
function textoResumo(r,de,ate){
 const pend=r.itens.filter(a=>!a.pago_prof);
 return `*Resumo de pagamento – Dedica Saúde*\nProfissional: ${r.nome} (nº ${r.id})\nPeríodo: ${brD(de)} a ${brD(ate)}\n\n`+
  (r.dias&&r.dias.length?'Diárias:\n'+r.dias.map(d=>`${brDC(d.data)} – ${d.tipo==='inteiro'?'Período inteiro':'Meio período'} – ${reais(d.valor)}${d.pago?' (pago)':''}`).join('\n')+'\n\n':'')+
  r.itens.filter(a=>+a.repasse>0).map(a=>`${brDC(a.data)} ${a.hora} – ${a.servico} – ${nomeCurto(a.cliente)} – ${reais(a.repasse)}${a.pago_prof?' (pago)':''}`).join('\n')+
  `\n\nAtendimentos realizados: ${r.itens.length}\nTotal do período: ${reais(r.tot)}\nJá pago: ${reais(r.pago)}\n*A pagar: ${reais(r.tot-r.pago)}*`+
  (r.pix?`\n\nPIX (${r.pix_tipo||'chave'}): ${r.pix}`:'');
}
async function telaPagto(silencioso){
 const [de,ate]=periodo();
 let DIA=[]; try{ let ag; [ag,DIA]=await Promise.all([carregarAgenda(de,ate),api('admDiarias',{de,ate})]); PGAG=ag.filter(a=>a.status==='realizado'); }catch(e){ if(!silencioso) toast(e.message); return; }
 const por={};
 PGAG.forEach(a=>{ const k=a.profissional_id; if(!por[k]){ const p=BASE.profissionais.find(x=>x.id===k)||{}; por[k]={id:k,nome:a.profissional,tel:p.telefone,pix:p.pix,pix_tipo:p.pix_tipo,n:0,tot:0,pago:0,ids:[],itens:[],dias:[],dpend:[]}; }
  const r=por[k]; r.n++; r.tot+=+a.repasse; r.itens.push(a); if(a.pago_prof) r.pago+=+a.repasse; else if(+a.repasse>0) r.ids.push(a.id); });
 DIA.filter(d=>d.tipo!=='nao').forEach(d=>{ const k=d.profissional_id; if(!por[k]){ const p=BASE.profissionais.find(x=>x.id===k)||{}; por[k]={id:k,nome:d.profissional,tel:p.telefone,pix:p.pix,pix_tipo:p.pix_tipo,n:0,tot:0,pago:0,ids:[],itens:[],dias:[],dpend:[]}; }
  const r=por[k]; r.dias.push(d); r.tot+=+d.valor; if(d.pago) r.pago+=+d.valor; else r.dpend.push(d); });
 const lin=Object.values(por).filter(r=>!PG.prof||r.id==PG.prof).sort((a,b)=>a.nome.localeCompare(b.nome));
 const l=PGAG.filter(a=>!PG.prof||a.profissional_id==PG.prof);
 const totPagar=lin.reduce((s,x)=>s+x.tot-x.pago,0), totPago=lin.reduce((s,x)=>s+x.pago,0);
 const cat={}; l.forEach(a=>{ const k=a.serv_esp||a.especialidade||'Outros'; const c=cat[k]||(cat[k]={n:0,ent:0,cli:0,pro:0}); const v=+a.valor||0, cl=a.pct_clinica!=null?v*a.pct_clinica/100:0; c.n++; c.ent+=v; c.cli+=cl; c.pro+=+a.repasse||0; });
 DIA.filter(d=>d.tipo!=='nao'&&(!PG.prof||d.profissional_id==PG.prof)).forEach(d=>{ const k=d.especialidade||'Outros'; const c=cat[k]||(cat[k]={n:0,ent:0,cli:0,pro:0}); c.pro+=+d.valor; });
 const ct=Object.entries(cat), T=ct.reduce((t,[,c])=>({n:t.n+c.n,ent:t.ent+c.ent,cli:t.cli+c.cli,pro:t.pro+c.pro}),{n:0,ent:0,cli:0,pro:0});
 const linCt=(k,c,b)=>`<tr${b?' style="font-weight:800;background:#eef2fb"':''}><td>${b?'<b>Total</b>':esc(k)}</td><td class="c">${c.n}</td><td>${reais(c.ent)}</td><td>${reais(c.cli)}</td><td>${reais(c.pro)}</td><td><b style="color:${c.ent-c.cli-c.pro<0?'#c0392b':'var(--teal)'}">${reais(c.ent-c.cli-c.pro)}</b></td></tr>`;
 const DIAV=DIA.filter(d=>!PG.prof||d.profissional_id==PG.prof);
 const htmlCt=`<div class="card"><h3 class="ct">Contabilidade · ${brD(de)} a ${brD(ate)}</h3><p class="dica" style="margin:0 0 10px">Só atendimentos <b>realizados</b> (pagos na unidade). Clínica = % clínica do serviço. Profissional = repasse por atendimento + diárias (meio período / período inteiro).</p><div class="tabwrap"><table><thead><tr><th>Categoria</th><th>Atend.</th><th>Entrou</th><th>Foi para a clínica</th><th>Profissional</th><th>Fica Dedica</th></tr></thead><tbody>${ct.map(([k,c])=>linCt(k,c)).join('')||'<tr><td colspan="6" class="vazio">Nenhum atendimento realizado no período.</td></tr>'}${ct.length>1?linCt('',T,1):''}</tbody></table></div></div>`;
 $('#P').innerHTML=`<div class="card"><div class="filtros"><label class="lb">Mês <input type="month" id="pMes" value="${PG.mes}"></label>
  <select id="pPer">${Object.entries(PER).map(([k,v])=>`<option value="${k}"${PG.per===k?' selected':''}>${v}</option>`).join('')}</select>
  <select id="pProf"><option value="">Todos os profissionais</option>${BASE.profissionais.map(p=>`<option value="${p.id}"${PG.prof==p.id?' selected':''}>${esc(p.nome)}</option>`).join('')}</select>
  <span style="flex:1"></span><button class="btn peq" id="pZap">Mandar resumo no WhatsApp</button><button class="btn sec peq" id="pCsv">Exportar CSV</button></div>
  <div class="kpis" style="margin:14px 0 0"><div class="kpi"><span>Atendimentos realizados</span><b>${l.length}</b></div><div class="kpi"><span>Já pago</span><b>${reais(totPago)}</b></div><div class="kpi alerta"><span>A pagar no período</span><b>${reais(totPagar)}</b></div></div></div>
  ${htmlCt}
  <div class="card"><h3 class="ct">Resumo de pagamento · ${brD(de)} a ${brD(ate)}</h3><div class="tabwrap"><table><thead><tr><th>Nº</th><th>Profissional</th><th>WhatsApp</th><th>PIX</th><th>Atend.</th><th>Total</th><th>Pago</th><th>A pagar</th><th>Ações</th></tr></thead><tbody>
  ${lin.map(r=>`<tr><td><b>${r.id}</b></td><td><b>${esc(r.nome)}</b></td><td>${zap(r.tel)}</td>
   <td>${r.pix?`<span class="cod">${esc(r.pix_tipo||'')}</span> <b>${esc(r.pix)}</b> <button class="btn sec mini" data-cpix="${r.id}">Copiar</button>`:`<a href="#" data-irprof="1" class="semPix">cadastrar PIX</a>`}</td>
   <td class="c">${r.n}</td><td>${reais(r.tot)}</td><td>${reais(r.pago)}</td><td><b style="color:${r.tot-r.pago>0?'#c0392b':'var(--teal)'}">${reais(r.tot-r.pago)}</b></td>
   <td style="white-space:nowrap"><button class="btn sec mini" data-cres="${r.id}">Resumo</button> ${r.tel?`<button class="btn sec mini" data-zres="${r.id}">WhatsApp</button>`:''} ${r.ids.length||r.dpend.length?`<button class="btn mini" data-pagar="${r.id}">Marcar pago</button>`:'<span class="tag st-concluido">Pago</span>'}</td></tr>`).join('')||'<tr><td colspan="9" class="c" style="padding:20px">Nenhum atendimento realizado no período. Marque os atendimentos como "Realizado" na Agenda.</td></tr>'}
  </tbody></table></div></div>
  ${DIAV.length?`<div class="card"><h3 class="ct">Diárias · ${brD(de)} a ${brD(ate)}</h3><p class="dica" style="margin:0 0 10px">Profissional pago por período. O sistema sugere pelo dia de escala com atendimento feito; ajuste se precisar (salva na hora).</p><div class="tabwrap"><table><thead><tr><th>Data</th><th>Profissional</th><th>Atend. feitos</th><th>Período</th><th>Valor</th><th>Pago</th></tr></thead><tbody>${DIAV.map((d,i)=>{ const p=BASE.profissionais.find(x=>x.id===d.profissional_id)||{}; return `<tr><td>${brDC(d.data)} ${DIASC[new Date(d.data+'T12:00:00').getDay()]}</td><td>${esc(d.profissional)}</td><td class="c">${d.atendimentos}</td><td><select data-dtipo="${i}"${d.pago?' disabled':''}><option value="nao"${d.tipo==='nao'?' selected':''}>Não trabalhou</option><option value="meio"${d.tipo==='meio'?' selected':''}>Meio período (${reais(p.valor_meio)})</option><option value="inteiro"${d.tipo==='inteiro'?' selected':''}>Período inteiro (${reais(p.valor_inteiro)})</option></select>${d.salvo?'':' <span class="cod">sugerido</span>'}</td><td>${reais(d.valor)}</td><td class="c">${d.tipo==='nao'?'':`<input type="checkbox" data-dpago="${i}"${d.pago?' checked':''}>`}</td></tr>`; }).join('')}</tbody></table></div></div>`:''}
  <div class="card"><h3 class="ct">Atendimentos do período</h3><div class="tabwrap"><table><thead><tr><th>Data</th><th>Hora</th><th>Profissional</th><th>Cliente</th><th>Serviço</th><th>Valor cobrado</th><th>Repasse</th><th>Pago ao profissional</th></tr></thead><tbody>${l.map(a=>`<tr><td>${brD(a.data)}</td><td>${a.hora}</td><td>${esc(a.profissional)}</td><td>${esc(a.cliente)} <span class="cod">#${a.cliente_id}</span></td><td>${esc(a.servico)}</td><td>${reais(a.valor)}</td><td>${reais(a.repasse)}</td><td class="c"><input type="checkbox" data-pg="${a.id}"${a.pago_prof?' checked':''}></td></tr>`).join('')||'<tr><td colspan="8" class="c" style="padding:20px">Nada aqui.</td></tr>'}</tbody></table></div></div>`;
 $('#P').querySelectorAll('[data-dtipo]').forEach(sel=>sel.onchange=async()=>{ const d=DIAV[+sel.dataset.dtipo]; try{ await api('admSalvarDiaria',{profissional_id:d.profissional_id,data:d.data,tipo:sel.value}); toast('Diária salva'); telaPagto(true); }catch(e){ toast(e.message); } });
 $('#P').querySelectorAll('[data-dpago]').forEach(c=>c.onchange=async()=>{ const d=DIAV[+c.dataset.dpago]; if(!c.checked&&!(await confirmar('Desmarcar esta diária como paga?','Desmarcar'))){ c.checked=true; return; } try{ await api('admSalvarDiaria',{profissional_id:d.profissional_id,data:d.data,tipo:d.tipo,pago:c.checked}); telaPagto(true); }catch(e){ c.checked=!c.checked; toast(e.message); } });
 $('#pMes').onchange=()=>{PG.mes=$('#pMes').value;telaPagto();};
 $('#pPer').onchange=()=>{PG.per=$('#pPer').value;telaPagto();};
 $('#pProf').onchange=()=>{PG.prof=$('#pProf').value;telaPagto();};
 $('#P').querySelectorAll('[data-irprof]').forEach(a=>a.onclick=e=>{e.preventDefault();irPara('profs');});
 $('#P').querySelectorAll('[data-cpix]').forEach(b=>b.onclick=()=>copiar(por[b.dataset.cpix].pix,'Chave PIX copiada'));
 $('#P').querySelectorAll('[data-cres]').forEach(b=>b.onclick=()=>copiar(textoResumo(por[b.dataset.cres],de,ate),'Resumo copiado'));
 $('#P').querySelectorAll('[data-zres]').forEach(b=>b.onclick=()=>{ const r=por[b.dataset.zres]; window.open(`https://wa.me/55${String(r.tel).replace(/\D/g,'')}?text=${encodeURIComponent(textoResumo(r,de,ate))}`,'_blank','noopener'); });
 $('#P').querySelectorAll('[data-pagar]').forEach(b=>b.onclick=async()=>{ const r=por[b.dataset.pagar]; if(!(await confirmar(`Confirmar pagamento de ${reais(r.tot-r.pago)} para ${r.nome}?\n${r.ids.length?r.ids.length+' atendimento(s) ':''}${r.dpend.length?r.dpend.length+' diária(s) ':''}de ${brD(de)} a ${brD(ate)}.${r.pix?'\nPIX ('+(r.pix_tipo||'chave')+'): '+r.pix:''}`,'Confirmar pagamento'))) return; try{ if(r.ids.length) await api('admPagarLote',{ids:r.ids,pago:true}); if(r.dpend.length) await api('admPagarDiarias',{itens:r.dpend.map(d=>({profissional_id:d.profissional_id,data:d.data,tipo:d.tipo})),pago:true}); toast('Pagamento registrado'); telaPagto(); }catch(e){toast(e.message);} });
 $('#P').querySelectorAll('[data-pg]').forEach(c=>c.onchange=async()=>{ if(!c.checked&&!(await confirmar('Desmarcar este atendimento como pago?','Desmarcar'))){ c.checked=true; return; } try{ await api('admAtualizarAg',{linha:{id:+c.dataset.pg,pago_prof:c.checked}}); telaPagto(); }catch(e){ c.checked=!c.checked; toast(e.message);} });
 $('#pZap').onclick=async()=>{
  let num=''; try{ num=localStorage.getItem('dd_zap_dono')||''; }catch(e){}
  if(!num){ num=(prompt('Seu WhatsApp para receber o resumo (com DDD, só números):','')||'').replace(/\D/g,''); if(!num) return; if(!num.startsWith('55')) num='55'+num; try{ localStorage.setItem('dd_zap_dono',num); }catch(e){} }
  let prox=[]; try{ const hj=hojeISO(); prox=(await carregarAgenda(hj,addD(hj,6))).filter(a=>a.status==='agendado'||a.status==='confirmado'); }catch(e){}
  const T2=ct.reduce((t,[,c])=>({n:t.n+c.n,ent:t.ent+c.ent,cli:t.cli+c.cli,pro:t.pro+c.pro}),{n:0,ent:0,cli:0,pro:0});
  const L=[`*Resumo Dedica Saúde*`,`${brD(de)} a ${brD(ate)}`,'',`Atendimentos feitos: ${T2.n}`,''];
  ct.forEach(([k,c])=>{ L.push(`*${k}*: ${c.n} atend.`); L.push(`Entrou ${reais(c.ent)}`+(c.cli?` · Clínica ${reais(c.cli)}`:'')+(c.pro?` · Profissional ${reais(c.pro)}`:'')+` · Dedica ${reais(c.ent-c.cli-c.pro)}`); L.push(''); });
  L.push(`*Total entrou:* ${reais(T2.ent)}`); if(T2.cli) L.push(`Foi para a clínica: ${reais(T2.cli)}`); L.push(`Profissionais: ${reais(T2.pro)}`); L.push(`*Fica Dedica:* ${reais(T2.ent-T2.cli-T2.pro)}`);
  const ap=lin.filter(r=>r.tot-r.pago>0); L.push(''); L.push(ap.length?'*A pagar*':'Nada a pagar aos profissionais.'); ap.forEach(r=>L.push(`${r.nome}: ${reais(r.tot-r.pago)}${r.pix?' (PIX '+(r.pix_tipo||'')+': '+r.pix+')':''}`));

  window.open(`https://wa.me/${num}?text=${encodeURIComponent(L.join('\n'))}`,'_blank','noopener');

const AS={st:{},passo:null,ocupado:false};
const asNorm=t=>String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const asTitulo=t=>String(t||'').trim().replace(/\s+/g,' ').toLowerCase().replace(/(^|\s)(\S)/g,(m,a,b)=>a+b.toUpperCase()).replace(/\s(Da|De|Do|Das|Dos|E)\s/g,m=>m.toLowerCase());
const asPrim=n=>String(n||'').split(' ')[0];

const asDL=iso=>{ const d=new Date(iso+'T12:00'); return ['domingo','segunda','terça','quarta','quinta','sexta','sábado'][d.getDay()]+', '+brD(iso); };

function asParseNasc(v){ const m=String(v).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); if(!m) return null; const iso=`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`; const d=new Date(iso+'T12:00'); if(isNaN(d)||d.getDate()!=+m[1]||iso>hojeISO()||+m[3]<1900) return null; return iso; }

async function asPasso(v){
 const S=AS.st;
 if(v==='#reiniciar') return asInicio();

 switch(AS.passo){
 case 'nome':{
  if(v.length<3) return asBot('Digite pelo menos 3 letras do nome.');

 }
 case 'cli':{

  if(v==='#novo'){ if(S.nomeDigitado.split(' ').length<2){ AS.passo='nomecompleto'; return asBot('Cadastro novo. Qual o *nome completo* do cliente?'); } S.novo={nome:S.nomeDigitado}; AS.passo='nasc'; return asBot(`Cadastro novo: *${S.novo.nome}*.\nQual a *data de nascimento*?`); }
  const c=(S.lista||[]).find(x=>'#c'+x.id===v); if(!c) return asBot('Escolha uma das opções acima.');

 }
 case 'nomecompleto':{
  if(v.trim().split(/\s+/).length<2) return asBot('Preciso do nome e sobrenome.');
  S.novo={nome:asTitulo(v)}; AS.passo='nasc'; return asBot(`Cadastro novo: *${S.novo.nome}*.\nQual a *data de nascimento*?`);
 }
 case 'nasc':{

  S.novo.nascimento=n; AS.passo='tel'; return asBot('WhatsApp do cliente? (opcional)',[{l:'Pular',v:'#pular'}]);
 }
 case 'tel':{
  if(v!=='#pular'){ const d=v.replace(/\D/g,''); if(d.length<10||d.length>13) return asBot('Número inválido. Ex.: *(21) 99999-9999*',[{l:'Pular',v:'#pular'}]); S.novo.telefone=d; }
  const r=await api('admSalvar',{tabela:'clientes',linha:{nome:S.novo.nome,nascimento:S.novo.nascimento,telefone:S.novo.telefone||null}});
  S.cli={id:r.id,nome:r.nome,telefone:r.telefone}; await asBot(`Cadastro criado: *${r.nome}* (#${r.id}).`);
  return asServico();
 }
 case 'serv':{
  const s=BASE.servicos.find(x=>'#s'+x.id===v); if(!s) return asBot('Escolha o serviço nas opções.');
  S.serv=s;
  const uids=[...new Set(BASE.horarios.filter(h=>BASE.profissionais.some(p=>p.id===h.profissional_id&&p.ativo&&p.especialidade===s.especialidade)).map(h=>h.unidade_id))];
  const us=BASE.unidades.filter(u=>u.ativo&&uids.includes(u.id));
  if(!us.length){ AS.passo='serv'; return asBot('Esse serviço ainda não tem horário cadastrado em nenhuma unidade. Escolha outro ou cadastre os horários na aba Profissionais.',asServChips()); }
  if(us.length===1){ S.unid=us[0]; return asCalendario(); }
  AS.passo='unid'; return asBot('Em qual *unidade*?',us.map(u=>({l:u.nome,s:u.endereco||'',v:'#u'+u.id})));
 }
 case 'unid':{
  const u=BASE.unidades.find(x=>'#u'+x.id===v); if(!u) return asBot('Escolha a unidade nas opções.');
  S.unid=u; return asCalendario();
 }
 case 'dia':{
  if(v==='#mesant'||v==='#mesprox'){ S.mes=addMes(S.mes,v==='#mesant'?-1:1); return asCalendario(true); }
  const iso=v.replace('#d',''); const sl=(S.slots||[]).filter(x=>x.data===iso); if(!sl.length) return asBot('Escolha um dia em branco no calendário.');

}
function asServChips(){ return BASE.servicos.filter(s=>s.ativo).sort((a,b)=>(a.especialidade||'').localeCompare(b.especialidade||'')||(a.ordem||0)-(b.ordem||0)).map(s=>({l:s.nome,s:s.especialidade+' · '+reais(s.valor),v:'#s'+s.id})); }

 w.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{ if(b.disabled) return; S.mes=addMes(S.mes,b.dataset.m==='#mesant'?-1:1); asCalendario(true); });
